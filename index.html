<!DOCTYPE html>
<html lang="ur">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Open When...</title>
<style>
  :root{
    --ink: #f3e9d2;
    --paper: #fbf3e2;
    --paper-shadow: #d8c7a0;
    --night: #1c1730;
    --night-deep: #120e21;
    --plum: #3a2452;
    --gold: #c9a24b;
    --gold-bright: #e6c877;
    --rose: #c96a6a;
    --font-display: 'Algerian', 'Cormorant Garamond', Georgia, 'Times New Roman', serif;
    --font-body: 'IM Fell English', 'Special Elite', Georgia, serif;
  }

  @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=IM+Fell+English:ital@0;1&family=Special+Elite&display=swap');

  * { box-sizing: border-box; }

  body{
    margin:0;
    min-height:100vh;
    background-color: #d8c39a;
    background-image:
      /* stains */
      radial-gradient(circle at 8% 15%, rgba(120,84,40,0.20), transparent 22%),
      radial-gradient(circle at 92% 12%, rgba(120,84,40,0.16), transparent 20%),
      radial-gradient(circle at 15% 88%, rgba(120,84,40,0.18), transparent 24%),
      radial-gradient(circle at 85% 92%, rgba(120,84,40,0.14), transparent 22%),
      radial-gradient(circle at 50% 50%, rgba(255,244,214,0.35), rgba(120,84,40,0.12) 75%),
      /* fold creases */
      linear-gradient(90deg, transparent 49.7%, rgba(90,60,20,0.10) 50%, transparent 50.3%),
      linear-gradient(0deg, transparent 49.7%, rgba(90,60,20,0.08) 50%, transparent 50.3%),
      /* paper fiber */
      repeating-linear-gradient(45deg, rgba(90,60,20,0.025) 0px, rgba(90,60,20,0.025) 1px, transparent 1px, transparent 3px),
      linear-gradient(170deg, #e6d3a8, #c9ac74 55%, #d8c39a 100%);
    color: #4a3a22;
    font-family: var(--font-body);
    padding: 48px 20px 80px;
    position: relative;
    overflow-x: hidden;
  }

  /* aged edge vignette + speckles */
  body::before{
    content:"";
    position: fixed;
    inset:0;
    background:
      radial-gradient(1px 1px at 12% 22%, rgba(90,60,20,0.35), transparent),
      radial-gradient(1px 1px at 78% 18%, rgba(90,60,20,0.3), transparent),
      radial-gradient(1px 1px at 55% 65%, rgba(90,60,20,0.25), transparent),
      radial-gradient(1px 1px at 30% 78%, rgba(90,60,20,0.3), transparent),
      radial-gradient(1px 1px at 88% 55%, rgba(90,60,20,0.25), transparent),
      radial-gradient(1px 1px at 40% 40%, rgba(90,60,20,0.2), transparent),
      radial-gradient(ellipse at center, transparent 55%, rgba(60,40,15,0.35) 100%);
    pointer-events:none;
    opacity:0.75;
  }

  header{
    text-align:center;
    max-width: 640px;
    margin: 0 auto 56px;
    position: relative;
    z-index: 1;
  }
  header .eyebrow{
    font-family: var(--font-body);
    letter-spacing: 3px;
    font-size: 12px;
    color: #8a5a2a;
    text-transform: uppercase;
    opacity: 0.85;
  }
  header h1{
    font-family: var(--font-display);
    font-weight: 600;
    font-size: clamp(34px, 6.5vw, 54px);
    letter-spacing: 1px;
    margin: 10px 0 14px;
    color: #5a3416;
    text-shadow: 0 1px 0 rgba(255,255,255,0.3);
  }
  header p{
    color: rgba(74,58,34,0.75);
    font-size: 16px;
    line-height: 1.7;
    max-width: 460px;
    margin: 0 auto;
  }
  .flourish{
    display:flex;
    align-items:center;
    justify-content:center;
    gap: 12px;
    margin: 0 0 18px;
    color: rgba(138,90,42,0.55);
  }
  .flourish::before, .flourish::after{
    content:"";
    height: 1px;
    width: 54px;
    background: linear-gradient(90deg, transparent, rgba(138,90,42,0.5));
  }
  .flourish::after{ background: linear-gradient(90deg, rgba(138,90,42,0.5), transparent); }
  .flourish span{ font-size: 14px; }

  .box{
    max-width: 980px;
    margin: 0 auto;
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(230px, 1fr));
    gap: 34px 28px;
    position: relative;
    z-index: 1;
  }

  .envelope{
    height: 230px;
    cursor: pointer;
    display: flex;
    justify-content: center;
  }
  .envelope-inner{
    position: relative;
    width: 100%;
    max-width: 170px;
    height: 100%;
  }

  /* warm glow pooling behind/under the jar */
  .jar-glow{
    position: absolute;
    left: 50%;
    bottom: 6%;
    transform: translateX(-50%);
    width: 100px;
    height: 100px;
    background: radial-gradient(circle, rgba(255,214,140,0.55), rgba(255,214,140,0) 70%);
    filter: blur(2px);
    animation: glowPulse 3.4s ease-in-out infinite;
    pointer-events: none;
  }
  @keyframes glowPulse{
    0%, 100% { opacity: 0.55; transform: translateX(-50%) scale(0.94); }
    50% { opacity: 0.9; transform: translateX(-50%) scale(1.04); }
  }

  /* ---- Jar body: rigid, wide-mouth, slightly conical container ---- */
  .env-body{
    position: absolute;
    left: 50%;
    bottom: 0;
    transform: translateX(-50%);
    width: 82%;
    height: 80%;
    background:
      linear-gradient(100deg, rgba(255,255,255,0.55) 0%, rgba(255,255,255,0.08) 10%, rgba(255,255,255,0.02) 22%, rgba(255,255,255,0.05) 40%, rgba(255,255,255,0.02) 60%, rgba(255,255,255,0.10) 78%, rgba(255,255,255,0.45) 100%),
      linear-gradient(180deg, rgba(255,255,255,0.16), rgba(255,255,255,0.05) 40%, rgba(255,255,255,0.10) 100%);
    clip-path: polygon(12% 0%, 88% 0%, 90% 3%, 84% 96%, 78% 100%, 22% 100%, 16% 96%, 10% 3%);
    box-shadow:
      inset 0 0 14px rgba(255,255,255,0.5),
      inset 0 -18px 22px rgba(120,110,90,0.10),
      inset 0 0 0 1px rgba(255,255,255,0.6);
    filter: drop-shadow(0 10px 14px rgba(50,32,10,0.25));
    display: flex;
    align-items: flex-end;
    justify-content: center;
    text-align: center;
    padding: 14px 10px 16px;
    transition: transform .25s ease, filter .25s ease;
  }
  .envelope:hover .env-body{
    transform: translateX(-50%) translateY(-4px);
    filter: drop-shadow(0 15px 20px rgba(50,32,10,0.3));
  }

  /* fireflies floating inside the jar */
  .jar-fireflies{
    position: absolute;
    inset: 0;
    clip-path: polygon(12% 0%, 88% 0%, 90% 3%, 84% 96%, 78% 100%, 22% 100%, 16% 96%, 10% 3%);
    pointer-events: none;
  }
  .jar-fireflies span{
    position: absolute;
    bottom: 6px;
    width: 5px; height: 5px;
    border-radius: 50%;
    background: #ffd97a;
    box-shadow: 0 0 6px 2px rgba(255,214,120,0.8);
    animation: floatUp 3.6s ease-in-out infinite;
  }
  .jar-fireflies span:nth-child(1){ left: 28%; animation-delay: 0s; }
  .jar-fireflies span:nth-child(2){ left: 55%; animation-delay: 1.1s; }
  .jar-fireflies span:nth-child(3){ left: 70%; animation-delay: 2.1s; }
  @keyframes floatUp{
    0% { transform: translateY(0) translateX(0); opacity: 0; }
    15% { opacity: 1; }
    50% { transform: translateY(-38px) translateX(4px); }
    85% { opacity: 0.8; }
    100% { transform: translateY(-70px) translateX(-3px); opacity: 0; }
  }

  /* ---- Wooden lid: EXTRA BOLD AND THICK ---- */
  .env-body::before{
    content:"";
    position:absolute;
    top:-42px;
    left:50%;
    transform: translateX(-50%);
    width: 90%;
    height: 48px;
    background:
      repeating-linear-gradient(90deg, rgba(70,42,20,0.35) 0px, rgba(70,42,20,0.35) 3px, rgba(50,30,10,0.2) 3px, rgba(50,30,10,0.2) 7px, transparent 7px, transparent 12px),
      repeating-linear-gradient(0deg, rgba(40,20,5,0.25) 0px, rgba(40,20,5,0.25) 2px, transparent 2px, transparent 4px),
      radial-gradient(circle at 30% 15%, rgba(255,240,200,0.55), transparent 45%),
      linear-gradient(180deg, #e8c979 0%, #d4a860 20%, #b98a52 40%, #9a6f3f 60%, #7a5228 80%, #5a3f1f 100%);
    border-radius: 70% 70% 12px 12px;
    border: 5px solid rgba(30,15,5,0.95);
    box-shadow: 
      0 12px 18px rgba(0,0,0,0.6),
      0 6px 12px rgba(0,0,0,0.4),
      inset 0 4px 8px rgba(255,240,200,0.45),
      inset 0 -3px 6px rgba(20,10,2,0.8);
    transition: transform .3s ease;
    transform-origin: center;
    z-index: 3;
  }
  .env-body.opened::before{
    transform: translateX(-45%) translateY(-38px) rotate(-25deg);
  }
  .env-body::after{ content: none; }

  /* ---- Twine + hanging tag ---- */
  .jar-string{
    position: absolute;
    top: -2px;
    left: 63%;
    width: 1px;
    height: 34px;
    background: repeating-linear-gradient(180deg, #a9915f 0, #a9915f 3px, transparent 3px, transparent 5px);
    z-index: 2;
    transform-origin: top center;
  }
  .jar-tag{
    position: absolute;
    top: 28px;
    left: 60%;
    width: 88px;
    background: linear-gradient(160deg, #e7cf9e, #d6b876);
    border: 1px solid rgba(120,84,40,0.35);
    border-radius: 3px 8px 3px 8px;
    padding: 7px 9px 8px;
    font-family: var(--font-display);
    font-weight: 600;
    font-size: 12px;
    line-height: 1.3;
    color: #4a3416;
    text-align: center;
    box-shadow: 0 3px 6px rgba(60,40,15,0.25);
    transform: rotate(4deg);
    z-index: 2;
  }
  .jar-tag::before{
    content:"";
    position:absolute;
    top: -3px; left: 50%;
    transform: translateX(-50%);
    width: 6px; height: 6px;
    border-radius: 50%;
    background: var(--night-deep);
    box-shadow: 0 0 0 2px rgba(120,84,40,0.3);
  }
  .env-body.unlocked ~ .jar-tag,
  .jar-tag.unlocked{
    background: linear-gradient(160deg, var(--gold-bright), #d1a94f);
    color: #4a2f0f;
  }
  .env-checkmark{
    display: block;
    margin-top: 3px;
    font-size: 10px;
    letter-spacing: 0.5px;
    opacity: 0.85;
  }

  .env-body.unlocked{
    border-color: var(--gold-bright);
  }

  /* Modal */
  .modal-overlay{
    position: fixed;
    inset:0;
    background: rgba(10,7,20,0.82);
    backdrop-filter: blur(4px);
    display:flex;
    align-items:center;
    justify-content:center;
    z-index: 50;
    opacity:0;
    pointer-events:none;
    transition: opacity .25s ease;
    padding: 20px;
  }
  .modal-overlay.show{ opacity:1; pointer-events:all; }

  .letter{
    background:
      radial-gradient(circle at 12% 15%, rgba(150,110,50,0.16), transparent 24%),
      radial-gradient(circle at 88% 10%, rgba(150,110,50,0.13), transparent 22%),
      radial-gradient(circle at 20% 88%, rgba(150,110,50,0.15), transparent 26%),
      radial-gradient(circle at 85% 90%, rgba(150,110,50,0.12), transparent 24%),
      radial-gradient(circle at 55% 50%, rgba(255,250,232,0.4), transparent 70%),
      linear-gradient(93deg, transparent 49.6%, rgba(90,60,20,0.07) 50%, transparent 50.4%),
      repeating-linear-gradient(45deg, rgba(90,60,20,0.02) 0px, rgba(90,60,20,0.02) 1px, transparent 1px, transparent 3px),
      linear-gradient(160deg, #fbf3e2, #ecdfbc 60%, #fbf3e2);
    color: #3a2c1a;
    max-width: 460px;
    width:100%;
    padding: 40px 32px 34px;
    position: relative;
    clip-path: polygon(2% 1%, 8% 0%, 14% 1.2%, 20% 0.3%, 27% 1%, 34% 0%, 41% 1.3%, 48% 0.2%, 55% 1%, 62% 0%, 69% 1.2%, 76% 0.3%, 83% 1%, 90% 0%, 97% 1.2%, 99% 6%, 100% 12%, 98.7% 18%, 100% 25%, 98.8% 32%, 100% 40%, 98.6% 48%, 100% 56%, 98.7% 64%, 100% 72%, 98.8% 80%, 100% 88%, 98.6% 95%, 95% 99%, 90% 100%, 83% 98.8%, 76% 100%, 69% 99%, 62% 100%, 55% 98.8%, 48% 100%, 41% 99%, 34% 100%, 27% 98.8%, 20% 100%, 13% 99%, 6% 100%, 2% 99%, 1% 92%, 0% 84%, 1.3% 76%, 0% 68%, 1.2% 60%, 0% 52%, 1.3% 44%, 0% 36%, 1.2% 28%, 0% 20%, 1.3% 12%, 0% 6%);
    filter: drop-shadow(0 25px 40px rgba(0,0,0,0.45));
    transform: scale(0.9) rotate(-1deg);
    transition: transform .3s ease;
    font-family: var(--font-body);
  }
  .modal-overlay.show .letter{ transform: scale(1) rotate(0deg); }

  .letter h2{
    font-family: var(--font-display);
    font-weight: 600;
    font-size: 22px;
    letter-spacing: 0.5px;
    margin: 0 0 18px;
    color: #5a3f1f;
  }
  .letter .wax-seal{
    width: 30px; height: 30px;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, var(--rose), #7a2f2f);
    box-shadow: 0 3px 6px rgba(0,0,0,0.3), inset 0 1px 2px rgba(255,255,255,0.25);
    margin: 0 auto 14px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 12px;
    color: rgba(255,255,255,0.85);
  }

  .letter .close-btn{
    position:absolute;
    top:12px; right:14px;
    background:none;
    border:none;
    font-size: 20px;
    cursor:pointer;
    color: #7a6a4a;
    line-height:1;
  }

  .question-box p.q{
    font-size: 17px;
    line-height: 1.7;
    margin-bottom: 16px;
  }
  .question-box input{
    width:100%;
    padding: 11px 12px;
    font-family: var(--font-body);
    font-size: 14px;
    border: 1px solid var(--paper-shadow);
    border-radius: 2px;
    background: #fff9ec;
    color:#3a2c1a;
    margin-bottom: 12px;
  }
  .question-box input:focus{ outline: 2px solid var(--rose); outline-offset:1px; }
  .question-box button{
    background: #5a3f1f;
    color: #fbf3e2;
    border:none;
    padding: 10px 20px;
    font-family: var(--font-body);
    font-size: 13px;
    letter-spacing: 1px;
    border-radius: 2px;
    cursor:pointer;
    transition: background .2s;
  }
  .question-box button:hover{ background:#7a5a30; }
  .hint-btn{
    background:none !important;
    color:#8a7a5a !important;
    padding: 6px 0 !important;
    text-decoration: underline;
    font-size:12px !important;
  }
  .wrong-msg{
    color: #a13f3f;
    font-size: 13px;
    margin: -6px 0 12px;
    min-height: 16px;
  }
  .hint-text{
    font-size: 12px;
    color: #7a6a4a;
    font-style: italic;
    margin: -6px 0 12px;
    min-height: 14px;
  }

  .message-box p{
    font-size: 17px;
    line-height: 1.9;
    white-space: pre-wrap;
  }
  .message-box .signoff{
    margin-top: 18px;
    font-family: var(--font-display);
    font-style: italic;
    font-size: 18px;
    text-align: right;
    color:#5a3f1f;
  }

  footer{
    text-align:center;
    margin-top: 60px;
    color: rgba(74,58,34,0.5);
    font-size: 12px;
    position: relative;
    z-index:1;
  }

  @media (max-width: 480px){
    .box{ grid-template-columns: repeat(auto-fill, minmax(130px,1fr)); gap: 30px 18px; }
    .envelope{ height: 195px; }
    .jar-tag{ font-size: 11px; width: 74px; padding: 5px 7px 6px; }
  }

  @media (prefers-reduced-motion: reduce){
    * { transition: none !important; }
  }

  /* ===== PASSWORD LOCK SCREEN (clean, matches page theme) ===== */
  #lockScreen{
    position:fixed; inset:0; z-index:99999;
    display:flex; align-items:center; justify-content:center;
    padding:24px;
    background-color:#d8c39a;
    background-image:
      radial-gradient(circle at 50% 50%, rgba(255,244,214,0.45), rgba(120,84,40,0.10) 75%),
      radial-gradient(ellipse at center, transparent 55%, rgba(60,40,15,0.30) 100%),
      linear-gradient(170deg, #e6d3a8, #cdb07a 55%, #d8c39a 100%);
    transition: opacity .5s ease;
  }
  #lockScreen.fade{ opacity:0; pointer-events:none; }
  #lockScreen.hidden{ display:none; }

  .lock-card{
    width:100%; max-width:360px;
    padding:34px 30px 26px;
    text-align:center;
    background:#fbf3e2;
    border:1px solid rgba(138,90,42,0.35);
    border-radius:4px;
    box-shadow: 0 18px 40px rgba(60,40,15,0.28), 0 2px 0 rgba(255,255,255,0.5) inset;
    font-family: var(--font-body);
    color:#3a2c1a;
  }
  .lock-card.shake{ animation: lockShake .4s; }
  @keyframes lockShake{
    0%,100%{transform:translateX(0)} 25%{transform:translateX(-8px)}
    50%{transform:translateX(7px)} 75%{transform:translateX(-4px)}
  }

  
  
  .lock-card h2{
    font-family: var(--font-display); font-weight:600;
    font-size:28px; letter-spacing:1px; color:#5a3416;
    margin:0 0 20px;
  }
  
  
  .lock-card input{
    width:100%; padding:12px;
    font-family: var(--font-body); font-size:18px;
    letter-spacing:5px; text-align:center;
    background:#fff9ec; color:#3a2c1a;
    border:1px solid var(--paper-shadow);
    border-radius:3px;
    transition: border-color .2s, box-shadow .2s;
  }
  .lock-card input::placeholder{ color:rgba(120,90,50,0.35); }
  .lock-card input:focus{
    outline:none; border-color:var(--gold);
    box-shadow:0 0 0 3px rgba(201,162,75,0.25);
  }
  .lock-card .lock-btn{
    width:100%; margin-top:12px; padding:12px;
    background:#5a3f1f; color:#fbf3e2; border:none; border-radius:3px;
    font-family: var(--font-body); font-size:13px; letter-spacing:3px;
    cursor:pointer; transition: background .2s;
  }
  .lock-card .lock-btn:hover{ background:#7a5a30; }
  .lock-err{ color:#a13f3f; font-size:13px; margin-top:14px; min-height:18px; }
  </style>
</head>
<body>
<div id="lockScreen">
  <div class="lock-card" id="lockBox">
    <h2>Enter Password</h2>
    <input type="password" id="lockInput" inputmode="numeric" autocomplete="off" placeholder="&bull;&bull;&bull;&bull;&bull;&bull;&bull;">
    <button class="lock-btn" id="lockBtn">OPEN</button>
    <div class="lock-err" id="lockErr"></div>
  </div>
</div>
<script>
(function(){
  var PASSWORD = '2322007';
  var screen = document.getElementById('lockScreen');
  var input = document.getElementById('lockInput');
  var err = document.getElementById('lockErr');
  var box = document.getElementById('lockBox');

  function check(){
    if(input.value.trim() === PASSWORD){
      screen.classList.add('fade');
      setTimeout(function(){ screen.classList.add('hidden'); }, 500);
    } else {
      err.textContent = 'Wrong password, please try again.';
      input.value = '';
      box.classList.remove('shake'); void box.offsetWidth; box.classList.add('shake');
    }
  }
  document.getElementById('lockBtn').addEventListener('click', check);
  input.addEventListener('keydown', function(e){ if(e.key === 'Enter') check(); });
  input.focus();
})();
</script>

  <h1>Open When...</h1>
  <div class="flourish"><span>&#10052;</span></div>
  <p>Har jar ek mauqa hai. Click karo, mera sawal ka jawab do, aur note nikal ao jayega. Kuch tumhein pata hoga, kuch shayad nahi &mdash; par sab dil se likha hai.</p>
</header>

<div class="box" id="box"></div>

<footer>banaya gaya thoda time aur bohat saara pyaar se &hearts;</footer>

<div class="modal-overlay" id="overlay">
  <div class="letter" id="letterCard">
    <button class="close-btn" id="closeBtn" aria-label="Close">&times;</button>
    <div id="letterContent"></div>
  </div>
</div>

<script>
/* ============================================================
   EDIT YOUR CARDS HERE — ye woh jagah hai jahan tum sab customize karoge.
   Har card mein:
     title    -> envelope pe likha hua ("Open when you're sad")
     question -> personal trivia sawal
     answers  -> array of acceptable correct answers (lowercase, no spaces needed — hum khud normalize karte hain)
     hint     -> optional chhota sa hint
     message  -> jab unlock ho jaye to jo letter dikhega
   ============================================================ */
const cards = [
  {
    title: "Open when you miss me",
    question: "Hamari pehli mulaqat kahan hui thi?",
    answers: ["university", "college", "school"],
    hint: "Woh jagah jahan hum dono padhte the...",
    message: "Jab bhi tum ye padh rahe ho, iska matlab tum mujhe miss kar rahe ho — aur main bhi. Yaad hai woh pehla din? Us waqt mujhe nahi pata tha ke ye itna khaas ban jayega.\n\nBas itna jaan lo: main bhi utna hi soch raha/rahi hoon jitna tum abhi soch rahe ho."
  },
  {
    title: "Open when you're sad",
    question: "Wo kaunsi cheez hai jo mujhe hamesha hansati hai jab main udaas hota/hoti hoon?",
    answers: ["your jokes", "memes", "food"],
    hint: "Socho, jab main down hota/hoti hoon to tum kya karte ho...",
    message: "Sab theek ho jayega. Tum akele nahi ho — main hamesha ek call/text door hoon.\n\nDeep breath lo. Ye waqt bhi guzar jayega, aur main tumhare saath hoon isse guzarne ke liye."
  },
  {
    title: "Open on a bad day",
    question: "Meri favourite comfort food kya hai?",
    answers: ["biryani"],
    hint: "Kuch masaledar aur sab ka pasandeeda...",
    message: "Aaj ka din chahe jaisa bhi ho, kal naya din hai. Tum bohat kuch handle kar chuke ho — ye bhi kar loge.\n\nApna khayal rakho, kuch acha khao, aur mujhe yaad rakho — main proud hoon tum pe."
  },
  {
    title: "Open when you need a smile",
    question: "Humari sabse funny yaadgar moment kaunsi thi?",
    answers: ["road trip", "picnic", "movie night"],
    hint: "Woh din jab hum dono bohat hanse the...",
    message: "Muskurao! Zindagi mein tumhare jaisa banda/bandi milna meri khushqismati hai.\n\nAaj kuch achi cheez hogi, dekhna."
  },
  {
    title: "Open when you're angry at me",
    question: "Mera sabse bura habit kya hai?",
    answers: ["late", "forgetful", "stubborn"],
    hint: "Kuch aisa jo tum hamesha kehte ho...",
    message: "Main jaanta/janti hoon ki maine tum ko upset kiya hai. Maafi chahta/chahti hoon. Tum mere liye kitne khaas ho, aur main nahi chahta/chahti ke ye baat kharab ho.\n\nBaat karte hain, theek ho jayega. Hamesha hota hai."
  },
  {
    title: "Open when you succeed",
    question: "Mera sabse bada dream kya tha jo tum jaante ho?",
    answers: ["graduation", "travel", "job", "career"],
    hint: "Kuch jo hum dono ne plan kiya tha...",
    message: "Tu kar gaya/gayi! Main itna proud hoon! Tere kaabil the tum hamesha — bas mujhe pata tha.\n\nYe toh bas shuruwat hai. Aage aur badi cheezein hogi. Aur main tumhare saath hoon har kadam par! 🎉"
  }
];

/* ============================================================ */

let unlocked = JSON.parse(sessionStorage.getItem('openwhen_unlocked') || '[]');

function saveUnlocked(){
  sessionStorage.setItem('openwhen_unlocked', JSON.stringify(unlocked));
}

function normalize(str){
  return str.trim().toLowerCase().replace(/\s+/g,' ');
}

function renderBox(){
  const box = document.getElementById('box');
  box.innerHTML = '';
  cards.forEach((card, i) => {
    const isUnlocked = unlocked.includes(i);
    const env = document.createElement('div');
    env.className = 'envelope';
    env.innerHTML = `
      <div class="envelope-inner">
        <div class="jar-glow"></div>
        <div class="env-body ${isUnlocked ? 'opened unlocked' : ''}">
          <div class="jar-fireflies"><span></span><span></span><span></span></div>
        </div>
        <div class="jar-string"></div>
        <div class="jar-tag ${isUnlocked ? 'unlocked' : ''}">
          ${card.title}
          ${isUnlocked ? '<span class="env-checkmark">read ✓</span>' : ''}
        </div>
      </div>
    `;
    env.addEventListener('click', () => openCard(i));
    box.appendChild(env);
  });
}

function openCard(i){
  const card = cards[i];
  const overlay = document.getElementById('overlay');
  const content = document.getElementById('letterContent');
  const isUnlocked = unlocked.includes(i);

  if(isUnlocked){
    content.innerHTML = `
      <div class="wax-seal">&hearts;</div>
      <h2>${card.title}</h2>
      <div class="message-box">
        <p>${card.message}</p>
      </div>
    `;
  } else {
    content.innerHTML = `
      <h2>${card.title}</h2>
      <div class="question-box">
        <p class="q">${card.question}</p>
        <input type="text" id="answerInput" placeholder="Apna jawab likho..." autocomplete="off">
        <div class="wrong-msg" id="wrongMsg"></div>
        <div class="hint-text" id="hintText"></div>
        <button id="submitBtn">Unlock</button>
        <button class="hint-btn" id="hintBtn" type="button">Hint chahiye?</button>
      </div>
    `;
    const input = document.getElementById('answerInput');
    const submitBtn = document.getElementById('submitBtn');
    const hintBtn = document.getElementById('hintBtn');
    const wrongMsg = document.getElementById('wrongMsg');
    const hintText = document.getElementById('hintText');

    const tryUnlock = () => {
      const val = normalize(input.value);
      const correct = card.answers.some(a => normalize(a) === val || val.includes(normalize(a)));
      if(correct){
        unlocked.push(i);
        saveUnlocked();
        openCard(i); // re-render as unlocked
        renderBox();
      } else {
        wrongMsg.textContent = 'Hmm, ye sahi jawab nahi hai — dobara socho!';
      }
    };

    submitBtn.addEventListener('click', tryUnlock);
    input.addEventListener('keydown', e => { if(e.key === 'Enter') tryUnlock(); });
    hintBtn.addEventListener('click', () => { hintText.textContent = card.hint || 'Koi hint nahi hai iske liye — dil se socho!'; });
  }

  overlay.classList.add('show');
}

document.getElementById('closeBtn').addEventListener('click', () => {
  document.getElementById('overlay').classList.remove('show');
});
document.getElementById('overlay').addEventListener('click', (e) => {
  if(e.target.id === 'overlay') document.getElementById('overlay').classList.remove('show');
});
document.addEventListener('keydown', e => {
  if(e.key === 'Escape') document.getElementById('overlay').classList.remove('show');
});

renderBox();
</script>
